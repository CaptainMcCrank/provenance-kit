# Fixture project manifest — minimal, opts into prompt provenance.
# Used by run_parity_test.sh. attestation.required is true so the test
# exercises the real provenance_gate; the runner provides an ephemeral GPG key.
identity:
  name: "provenance-fixture"
  project_type: "webapp"

status:
  current_phase: "prd_development"

inputs:
  product_proposal:
    path: "docs/inputs/product_proposal.md"
    sha256: "PLACEHOLDER_SET_BY_RUNNER"

prompt_provenance:
  enabled: true
  module_path: "./provenance-kit"
  library_repository: "<your prompt library remote, if any>"
  library_path: "<from PROMPT_LIBRARY_PATH in .env>"
  library_commit_at_init: null
  storage_root: ".build-provenance"
  current_session: null
  hash_algorithm: "sha256"
  chain: "append-only"
  attestation:
    required: true
    signer_key_id: "<from GPG_SIGNING_KEY_ID in .env>"
    formula: "SHA256(library_commit || project_final_commit || session_id || audit_chain_head)"
  verify_on_build: true
  counter_capture: "hybrid"
  harness_autodetect: true
  archive_after_days: 30
  keep_minimum_sessions: 1
